[package]
name = "bloody-level"
version = "0.1.0"
description = "Local-only clinical lab-PDF tracker with embedded OCR/LLM tiers"
authors = ["supermarsx and maintainers"]
edition = "2021"
rust-version = "1.95"

[lib]
name = "bloody_level_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

# Used by build.rs to fetch pdfium binaries on first build (per target triple)
# from bblanchon/pdfium-binaries releases. Pure-Rust stack — no system OpenSSL,
# no system libcurl, no extra setup on any platform.
ureq   = { version = "3.4", default-features = false, features = ["rustls", "gzip"] }
flate2 = "1.1"
tar    = "0.4"

[dependencies]
# --- Tauri shell -----------------------------------------------------------
tauri = { version = "2.11", features = ["protocol-asset"] }
tauri-plugin-dialog = "2.7"
tauri-plugin-fs = "2.5"
tauri-plugin-os = "2.3"

# --- Serialization ---------------------------------------------------------
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# --- Errors / async --------------------------------------------------------
thiserror = "2"
anyhow = "1.0"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "fs", "sync", "io-util"] }
once_cell = "1.21"

# --- Encrypted storage -----------------------------------------------------
# SQLite3 Multiple Ciphers bundles its crypto implementation, without OpenSSL.
# Keep SQLCipher v4 file compatibility in db/connection.rs.
rusqlite = { version = "0.40", features = ["bundled"] }
rusqlite_migration = "2.6"

# --- Crypto ----------------------------------------------------------------
argon2 = "0.6"
chacha20poly1305 = "0.11"
hkdf = "0.13"
sha2 = "0.11"
rand = "0.10"
secrecy = "0.10"
zeroize = { version = "1", features = ["derive"] }
base64 = "0.23"

# --- PDF ingestion ---------------------------------------------------------
pdfium-render = { version = "0.9", features = ["thread_safe", "image_latest"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

# --- Parsing utilities -----------------------------------------------------
regex = "1.13"
strsim = "0.11"
unicode-normalization = "0.1.25"
ahash = "0.8"

# --- Logging ---------------------------------------------------------------
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }

# --- Native OS credential vault -------------------------------------------
# Uses Windows Credential Manager, macOS Keychain, or Linux Secret Service.
keyring = { version = "4.2", default-features = true }

# --- Explicit user-initiated resource downloads ---------------------------
# Rustls keeps runtime downloads free of OpenSSL/native-tls requirements.
ureq = { version = "3.4", default-features = false, features = ["rustls", "gzip"] }
zip = { version = "6.0", default-features = false, features = ["deflate"] }

# --- Extraction tiers ------------------------------------------------------
llama-cpp-2 = { version = "0.1.156", optional = true }

[features]
# The distributed build includes every extraction tier. Tesseract still needs
# a local Tesseract installation and model data at runtime; the embedded tiers
# load their model files only when explicitly used from the app.
#
#   embedded-llm         Phi-4-mini-reasoning via llama.cpp
#   embedded-ocr-vision  olmOCR-2 vision OCR (same llama.cpp runtime)
#   tesseract-ocr        Tesseract OCR via the local tesseract CLI
default = ["tesseract-ocr", "embedded-llm", "embedded-ocr-vision"]

tesseract-ocr        = []
embedded-llm         = ["dep:llama-cpp-2"]
embedded-ocr-vision  = ["dep:llama-cpp-2"]

[dev-dependencies]
tempfile = "3.27"

# Bundle SQLite3 Multiple Ciphers behind the standard SQLite C API.
# Source versions, licenses and update instructions are in the vendor README.
[patch.crates-io]
libsqlite3-sys = { path = "vendor/libsqlite3-sys" }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[profile.dev.package."*"]
opt-level = 1   # speed up SQLCipher / regex / image deps in dev builds
