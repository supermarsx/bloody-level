[package]
name = "blevel-tracker"
version = "0.1.0"
description = "Local-only clinical lab-PDF tracker with embedded OCR/LLM tiers"
authors = ["blevel-tracker"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "blevel_tracker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

# Used by build.rs to fetch pdfium binaries on first build (per target triple)
# from bblanchon/pdfium-binaries releases. Pure-Rust stack — no system OpenSSL,
# no system libcurl, no extra setup on any platform.
ureq   = { version = "2", default-features = false, features = ["tls", "gzip"] }
flate2 = "1"
tar    = "0.4"

[dependencies]
# --- Tauri shell -----------------------------------------------------------
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-os = "2"

# --- Serialization ---------------------------------------------------------
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# --- Errors / async --------------------------------------------------------
thiserror = "1"
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "sync", "io-util"] }
once_cell = "1"

# --- Encrypted storage -----------------------------------------------------
rusqlite = { version = "0.31", features = ["bundled-sqlcipher-vendored-openssl"] }
rusqlite_migration = "1"

# --- Crypto ----------------------------------------------------------------
argon2 = "0.5"
chacha20poly1305 = "0.10"
hkdf = "0.12"
sha2 = "0.10"
rand = "0.8"
secrecy = "0.10"
zeroize = { version = "1", features = ["derive"] }
base64 = "0.22"

# --- PDF ingestion ---------------------------------------------------------
pdfium-render = { version = "0.8", features = ["thread_safe", "image"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

# --- Parsing utilities -----------------------------------------------------
regex = "1"
strsim = "0.11"            # fuzzy analyte matching
unicode-normalization = "0.1"
ahash = "0.8"

# --- Logging ---------------------------------------------------------------
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# --- Optional tiers (disabled by default; enabled per cargo feature) -------
tesseract = { version = "0.15", optional = true }
llama-cpp-2 = { version = "0.1", optional = true }

[features]
# Default build is lean: pdfium + SQLCipher + the parser. The optional tiers
# stay opt-in because each adds significant build time and runtime requirements
# without yet providing user-visible functionality:
#
#   --features embedded-llm         Phi-4-mini-reasoning via llama.cpp
#                                   (~5 min first build, requires MSVC + CMake)
#   --features embedded-ocr-vision  olmOCR-2 vision OCR (same llama.cpp runtime)
#   --features tesseract-ocr        Tesseract OCR; needs vcpkg + libtesseract
#                                   on the build host.
default = []

tesseract-ocr        = ["dep:tesseract"]
embedded-llm         = ["dep:llama-cpp-2"]
embedded-ocr-vision  = ["dep:llama-cpp-2"]

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[profile.dev.package."*"]
opt-level = 1   # speed up SQLCipher / regex / image deps in dev builds
