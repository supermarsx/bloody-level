<!doctype html>
<html lang="en-US" data-locale="en-US" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="color-scheme" content="dark light" />
    <title>bloody-level</title>
    <script>
      // Apply persisted theme before first paint to prevent flash.
      (function () {
        try {
          // Locale preference is stored in the encrypted settings table, so
          // the browser/OS language is the safe default before unlock.
          const languages = [...(navigator.languages || []), navigator.language]
            .filter(Boolean)
            .map((value) => value.toLowerCase());
          const locale = languages.some(
            (value) => value === "pt" || value.startsWith("pt-"),
          )
            ? "pt-PT"
            : "en-US";
          document.documentElement.setAttribute("lang", locale);
          document.documentElement.setAttribute("data-locale", locale);

          const stored =
            localStorage.getItem("bloody-level.theme") ??
            localStorage.getItem("blevel.theme");
          const mode =
            stored && ["light", "dark", "system"].includes(stored)
              ? stored
              : "system";
          const sysDark = window.matchMedia(
            "(prefers-color-scheme: dark)",
          ).matches;
          const resolved =
            mode === "system" ? (sysDark ? "dark" : "light") : mode;
          document.documentElement.setAttribute("data-theme", resolved);
        } catch {}
      })();
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover" class="bg-bg1 text-fg1 antialiased">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
