site_name: bloody-level
site_description: A private, local-first desktop app for reviewing longitudinal lab results.
site_url: https://supermarsx.github.io/bloody-level/
repo_name: supermarsx/bloody-level
repo_url: https://github.com/supermarsx/bloody-level
edit_uri: edit/master/docs/
docs_dir: docs

theme:
  name: material
  language: en
  font: false
  logo: assets/favicon.svg
  favicon: assets/favicon.svg
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.tracking
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.action.edit
    - content.action.view
    - content.code.copy
    - content.code.annotate
  palette:
    # Keep the first palette dark: this is the default even before the
    # preference script has run, which avoids a light flash on private data.
    - scheme: slate
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/weather-night
        name: Use light mode
    - scheme: default
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/weather-sunny
        name: Use dark mode

plugins:
  - search:
      lang: en

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.superfences

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/supermarsx/bloody-level
      name: bloody-level on GitHub

nav:
  - Home: index.md
  - Start here:
      - Installation: getting-started/installation.md
      - First run: getting-started/first-run.md
  - User guide:
      - Dashboard: user-guide/dashboard.md
      - Importing PDFs: user-guide/ingest.md
      - Reviewing results: user-guide/reviewing-results.md
      - Patients and records: user-guide/patients-and-records.md
      - Compare and charts: user-guide/compare-and-charts.md
      - Settings and ontology: user-guide/settings-and-ontology.md
  - Data and security:
      - How data moves: data-and-security/data-flow.md
      - Privacy and encryption: data-and-security/privacy.md
      - Security controls: data-and-security/security.md
      - Backup and restore: data-and-security/backup-restore.md
  - Developer guide:
      - Architecture: developer/architecture.md
      - Local development: developer/local-development.md
      - Testing and CI: developer/testing-and-ci.md
      - Releases and versioning: developer/releases.md
  - Reference:
      - File locations: reference/file-locations.md
      - Troubleshooting: reference/troubleshooting.md
      - Implementation status: reference/status.md
      - Original implementation plan: implementation-plan.md
